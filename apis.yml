  reason: no-developer-program
  detail: >-
    Ai-Blockchain sells enterprise blockchain and AI consulting engagements through a contact
    form and ships no developer surface at all — ai-blockchain.com is a purchased React marketing
    template deployed without SPA rewrites, so even its own /services and /contact-us routes
    return a hard 404 to a direct fetch; every named /.well-known/, /openapi.json, /swagger.json,
    /apis.json and /llms.txt path 404s on both ai-blockchain.com and www; and the one deliberately
    configured developer-shaped host, docs.ai-blockchain.com, is a dangling CNAME to ghs.google.com
    that answers a Google 404 with no TLS certificate at all.
