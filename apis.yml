aid: aiblockchain
name: Ai-Blockchain
description: >-
  Ai-Blockchain (also styled AI BlockChain, AIBC) is a Hoboken, New Jersey enterprise blockchain and
  artificial-intelligence software company founded in 2014 by Drew Hingorani and Stephen Reed. It builds a
  proprietary, patented private distributed ledger — US Patent 10,579,974, "Systems, methods, and program
  products for a distributed digital asset network with rapid transaction settlements" — that the company
  describes as gas-free, energy efficient and immutable, with artificial-intelligence agents managing the
  chain itself. Its marketed service lines are private blockchain with instant settlement, smart payment
  and transaction platforms, secure streaming and content distribution / digital rights management,
  AI-powered virtual assistants and customer-service chatbots, cloud cost optimization, a LIMS healthcare
  product, and custom AI + blockchain application development. It sells enterprise engagements and
  consulting rather than a self-serve developer product: as of September 2026 the company publishes no
  developer portal, API reference, SDK, or machine-readable API contract on any host it controls.
